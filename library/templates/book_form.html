{% extends 'base.html' %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 520px;">
    <div class="card-body">
        <h3 class="mb-3">{{ heading }}</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-dark">Save</button>
            <a href="{% url 'book_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
