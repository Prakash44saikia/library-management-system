<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Library System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'home' %}">Library System</a>
    <div>
        {% if user.is_authenticated %}
            <span class="text-white me-3">
                {{ user.username }} ({% if user.is_staff %}Librarian{% else %}Member{% endif %})
            </span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
            <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </div>
</nav>
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
