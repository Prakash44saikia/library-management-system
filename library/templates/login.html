{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 420px;">
    <div class="card-body">
        <h3 class="mb-3">Login</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-dark w-100">Login</button>
        </form>
        <p class="mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
