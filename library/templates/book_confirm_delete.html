{% extends 'base.html' %}
{% block title %}Delete book{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 520px;">
    <div class="card-body">
        <h3>Delete "{{ book.title }}"?</h3>
        <p>This also removes its issue records. This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'book_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
